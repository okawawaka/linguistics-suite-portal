<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Swiss Style Monochromatic Base with Swiss Red Signal -->
  <rect width="64" height="64" fill="#111111" />
  
  <!-- 4-Quadrant Grid Separators (Swiss Precision 1px grid) -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#262626" stroke-width="2" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#262626" stroke-width="2" />

  <!-- Quadrant 1 (Top-Left): Acoustic Waveform in Swiss Red -->
  <rect x="10" y="20" width="3" height="8" fill="#E30613" />
  <rect x="15" y="14" width="3" height="14" fill="#E30613" />
  <rect x="20" y="10" width="3" height="18" fill="#E30613" />
  <rect x="25" y="17" width="3" height="11" fill="#E30613" />

  <!-- Quadrant 2 (Top-Right): IPA Typography [ ʃ ] -->
  <text x="47" y="25" fill="#FFFFFF" font-family="'JetBrains Mono', 'Noto Sans', monospace" font-size="18" font-weight="700" text-anchor="middle">ʃ</text>

  <!-- Quadrant 3 (Bottom-Left): Syntax Tree Branching [ ∧ ] -->
  <polyline points="14,53 23,39 31,53" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square" />
  <line x1="23" y1="39" x2="23" y2="36" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Quadrant 4 (Bottom-Right): Phonological Rule Arrow [ → ] -->
  <line x1="39" y1="46" x2="54" y2="46" stroke="#FFFFFF" stroke-width="2.5" />
  <polyline points="49,41 54,46 49,51" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square" />

  <!-- Central Red Registration Dot (Swiss Focal Point) -->
  <rect x="30" y="30" width="4" height="4" fill="#E30613" />
</svg>
