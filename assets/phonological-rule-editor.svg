  <rect width="64" height="64" fill="#111111" />
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#262626" stroke-width="1.5" />
  
  <!-- Left Bracket [ -->
  <path d="M 18 16 H 12 V 48 H 18" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" />
  
  <!-- Right Bracket ] -->
